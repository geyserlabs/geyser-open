name: Publish developer documentation

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published SDK/CLI version without the v prefix
        required: true
        type: string

permissions: {}

concurrency:
  group: developer-documentation
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify published version and exact release source
        env:
          DOCS_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$DOCS_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF" = "refs/tags/v$DOCS_VERSION"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "refs/tags/v${DOCS_VERSION}^{commit}")" = "$GITHUB_SHA"
          test "$(python scripts/release_assets.py version)" = "$DOCS_VERSION"
          gh release view "v$DOCS_VERSION" --json tagName,isDraft,isPrerelease |
            python -c 'import json,os,sys; r=json.load(sys.stdin); assert r["tagName"] == "v"+os.environ["DOCS_VERSION"] and not r["isDraft"] and not r["isPrerelease"]'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Build documentation
        env:
          DOCS_VERSION: ${{ inputs.version }}
        run: |
          uv sync --all-packages --group docs --locked
          make docs
      - name: Publish immutable version and stable alias
        env:
          DOCS_VERSION: ${{ inputs.version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          uv run mike deploy --push --update-aliases "$DOCS_VERSION" stable
          uv run mike set-default --push stable
          git fetch origin gh-pages
          pages_dir="$RUNNER_TEMP/geyser-open-gh-pages"
          git worktree add --detach "$pages_dir" origin/gh-pages
          uv run python scripts/finalize_docs_release.py \
            --pages-dir "$pages_dir" \
            --source-docs docs \
            --version "$DOCS_VERSION"
          git -C "$pages_dir" add \
            CNAME robots.txt llms.txt sitemap.xml sitemap.xml.gz \
            "$DOCS_VERSION/sitemap.xml" "$DOCS_VERSION/sitemap.xml.gz"
          if ! git -C "$pages_dir" diff --cached --quiet; then
            git -C "$pages_dir" commit -m "Finalize developer docs $DOCS_VERSION"
            git -C "$pages_dir" push origin HEAD:gh-pages
          fi
          git worktree remove "$pages_dir"
