name: Publish developer documentation

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published SDK/CLI version without the v prefix
        required: true
        type: string

permissions: {}

concurrency:
  group: developer-documentation
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: documentation
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Verify clean protected main and published version
        env:
          DOCS_VERSION: ${{ inputs.version }}
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -z "$(git status --porcelain)"
          uv sync --all-packages --all-extras --all-groups --locked
          test "$DOCS_VERSION" = "$(uv run python scripts/release_assets.py validate-source)"
          make docs
      - name: Publish immutable version and stable alias
        env:
          DOCS_VERSION: ${{ inputs.version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          uv run mike deploy --push --update-aliases "$DOCS_VERSION" stable
          uv run mike set-default --push stable
          git fetch origin gh-pages
          pages_dir="$RUNNER_TEMP/geyser-open-gh-pages"
          git worktree add --detach "$pages_dir" origin/gh-pages
          uv run python scripts/finalize_docs_release.py \
            --pages-dir "$pages_dir" \
            --source-docs docs \
            --version "$DOCS_VERSION"
          git -C "$pages_dir" add \
            CNAME robots.txt llms.txt sitemap.xml sitemap.xml.gz \
            "$DOCS_VERSION/sitemap.xml" "$DOCS_VERSION/sitemap.xml.gz"
          if ! git -C "$pages_dir" diff --cached --quiet; then
            git -C "$pages_dir" commit -m "Finalize developer docs $DOCS_VERSION"
            git -C "$pages_dir" push origin HEAD:gh-pages
          fi
          git worktree remove "$pages_dir"
