name: Release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish without the v prefix"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  python-distributions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Build distributions once
        run: |
          uv sync --all-packages --all-extras --dev --locked
          mkdir release-python
          uv build --package geyser-sdk --out-dir release-python
          uv build --package geyser-open --out-dir release-python
          .venv/bin/python scripts/verify_distributions.py release-python
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-python
          path: release-python/*
          retention-days: 1

  standalone-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: darwin-arm64
          - runner: ubuntu-24.04
            target: linux-amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Build standalone CLI once
        run: |
          uv sync --all-packages --all-extras --all-groups --locked
          uv run python scripts/build_standalone.py --output-dir release-standalone
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-standalone-${{ matrix.target }}
          path: release-standalone/*
          retention-days: 1

  assemble:
    needs: [python-distributions, standalone-cli]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Add contracts and checksums
        run: |
          VERSION="$(python scripts/release_assets.py version)"
          test "$RELEASE_TAG" = "v$VERSION"
          python scripts/release_assets.py contracts \
            --output-dir release-assets \
            --source-epoch "$(git show -s --format=%ct HEAD)"
          (cd release-assets && shasum -a 256 * > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: complete-release
          path: release-assets/*
          retention-days: 1

  publish-pypi-sdk:
    needs: assemble
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: complete-release
          path: release-assets
      - run: mkdir pypi-dist-sdk && cp release-assets/geyser_sdk-*.whl release-assets/geyser_sdk-*.tar.gz pypi-dist-sdk/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: pypi-dist-sdk/
          attestations: false

  publish-pypi-open:
    needs: assemble
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: complete-release
          path: release-assets
      - run: mkdir pypi-dist-open && cp release-assets/geyser_open-*.whl release-assets/geyser_open-*.tar.gz pypi-dist-open/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: pypi-dist-open/
          attestations: false

  publish-github-release:
    needs: [assemble, publish-pypi-sdk, publish-pypi-open]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: complete-release
          path: release-assets
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" release-assets/* --generate-notes --title "Geyser Open $RELEASE_TAG"
