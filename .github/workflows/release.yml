name: Release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish without the v prefix"
        required: true
        type: string
      reuse_run_id:
        description: "Optional original release run whose verified artifacts should be published without rebuilding"
        required: false
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  python-distributions:
    if: ${{ !inputs.reuse_run_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Build distributions once
        run: |
          uv sync --all-packages --all-extras --dev --locked
          mkdir release-python
          uv build --package geyser-sdk --out-dir release-python
          uv build --package geyser-open --out-dir release-python
          .venv/bin/python scripts/verify_distributions.py release-python
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-python
          path: release-python/*
          retention-days: 1

  standalone-cli:
    if: ${{ !inputs.reuse_run_id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: darwin-arm64
          - runner: ubuntu-24.04
            target: linux-amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install Linux extension sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y apparmor bubblewrap
          if test -s /etc/apparmor.d/bwrap-userns-restrict; then
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          else
            sudo install -m 0644 .github/ci/bwrap.apparmor /etc/apparmor.d/geyser-ci-bwrap
            sudo apparmor_parser -r /etc/apparmor.d/geyser-ci-bwrap
          fi
      - name: Build standalone CLI once
        run: |
          uv sync --all-packages --all-extras --all-groups --locked
          uv run python scripts/build_standalone.py --output-dir release-standalone
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-standalone-${{ matrix.target }}
          path: release-standalone/*
          retention-days: 1

  assemble:
    needs: [python-distributions, standalone-cli]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Add contracts and checksums
        run: |
          VERSION="$(python scripts/release_assets.py version)"
          test "$RELEASE_TAG" = "v$VERSION"
          python scripts/release_assets.py contracts \
            --output-dir release-assets \
            --source-epoch "$(git show -s --format=%ct HEAD)"
          (cd release-assets && shasum -a 256 * > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: complete-release
          path: release-assets/*
          retention-days: 1

  reuse-artifacts:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.reuse_run_id != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify original release run and tag
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        run: python scripts/recover_release.py source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: complete-release
          path: release-assets
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ github.token }}
      - name: Verify exact artifacts and distribution metadata
        run: python scripts/recover_release.py assets release-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: complete-release
          path: release-assets/*
          retention-days: 1

  publish-pypi-sdk:
    needs: [assemble, reuse-artifacts]
    if: ${{ !cancelled() && (needs.assemble.result == 'success' || needs.reuse-artifacts.result == 'success') }}
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: complete-release
          path: release-assets
      - run: mkdir pypi-dist-sdk && cp release-assets/geyser_sdk-*.whl release-assets/geyser_sdk-*.tar.gz pypi-dist-sdk/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: pypi-dist-sdk/
          attestations: false

  publish-pypi-open:
    needs: [assemble, reuse-artifacts]
    if: ${{ !cancelled() && (needs.assemble.result == 'success' || needs.reuse-artifacts.result == 'success') }}
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: complete-release
          path: release-assets
      - run: mkdir pypi-dist-open && cp release-assets/geyser_open-*.whl release-assets/geyser_open-*.tar.gz pypi-dist-open/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: pypi-dist-open/
          attestations: false

  publish-github-release:
    needs: [publish-pypi-sdk, publish-pypi-open]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: complete-release
          path: release-assets
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: geyserlabs/geyser-open
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            mkdir published
            gh release download "$RELEASE_TAG" --pattern SHA256SUMS --dir published
            cmp release-assets/SHA256SUMS published/SHA256SUMS
          else
            gh release create "$RELEASE_TAG" release-assets/* --generate-notes --title "Geyser Open $RELEASE_TAG"
          fi
