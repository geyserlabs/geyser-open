name: Signed reference packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/reference-packages.yml'
      - 'sdk/**'
      - 'cli/**'
      - 'examples/packages/**'

permissions: {}

jobs:
  handlers:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --all-extras --dev --locked
      - name: Install Linux extension sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y apparmor bubblewrap
          if test -s /etc/apparmor.d/bwrap-userns-restrict; then
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          else
            sudo install -m 0644 .github/ci/bwrap.apparmor /etc/apparmor.d/geyser-ci-bwrap
            sudo apparmor_parser -r /etc/apparmor.d/geyser-ci-bwrap
          fi
      - name: Exercise handlers and validate instructions
        run: |
          .venv/bin/python - <<'PYTHON'
          import json, os, re, subprocess, sys, tempfile
          from pathlib import Path
          from geyser_sdk.sandbox import _command, _mac_memory_reader, available
          report = {"sandbox_available": available(), "platform": sys.platform}
          if sys.platform == "darwin":
              try:
                  _mac_memory_reader()(os.getpid())
                  report["memory_inspection"] = "available"
              except Exception:
                  report["memory_inspection"] = "unavailable"
          if not report["sandbox_available"]:
              with tempfile.TemporaryDirectory() as directory:
                  root = Path(directory).resolve()
                  (root / "handler.py").write_text("def run(value): return value\n")
                  try:
                      result = subprocess.run(_command(root, root, "handler.py", "run", 2, 536870912),
                          input=b"{}", capture_output=True, timeout=5, env={"LANG": "C.UTF-8"})
                      report["probe_returncode"] = result.returncode
                      report["probe_categories"] = [name for name, phrase in {
                          "operation_denied": b"Operation not permitted",
                          "sandbox_apply_denied": b"sandbox_apply",
                          "exec_denied": b"execvp",
                          "permission_denied": b"Permission denied",
                          "file_missing": b"No such file",
                          "library_missing": b"Library not loaded",
                          "python_startup": b"Fatal Python error",
                      }.items() if phrase in result.stderr]
                      report["probe_frames"] = [
                          {"module": Path(path).name, "line": int(line)}
                          for path, line in re.findall(r'File "([^"]+)", line ([0-9]+)',
                              result.stderr.decode(errors="replace"))
                      ]
                      report["interpreter_kind"] = (
                          "framework" if "Frameworks" in sys.base_prefix else "standalone")
                  except Exception as error:
                      report["probe_error_type"] = type(error).__name__
          print(json.dumps(report, sort_keys=True))
          PYTHON
          uv run geyser test examples/packages/issue-normalizer
          uv run geyser test examples/packages/source-review-gate
          uv run geyser validate examples/packages/careful-review

  packages:
    needs: handlers
    if: github.ref == 'refs/heads/main'
    runs-on: macos-14
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --all-extras --dev --locked
      - name: Build once and sign the exact archives
        run: |
          .venv/bin/python scripts/build_reference_packages.py --output-dir dist/reference-packages
          for archive in dist/reference-packages/*.zip; do
            uv tool run --from sigstore==4.5.0 sigstore sign --bundle "$archive.sigstore.json" "$archive"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: developer-reference-packages
          path: dist/reference-packages/*
          retention-days: 14
