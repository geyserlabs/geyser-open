name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --all-packages --all-extras --all-groups --locked
      - run: make schemas lint typecheck test package docs docs-snippets security
      - run: make install-smoke uninstall-smoke

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0

  pr-gate:
    name: pr-gate
    if: always()
    needs: [python, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Require the complete SDK and CLI gate
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs['dependency-review'].result }}
        run: |
          set -euo pipefail
          [[ "$PYTHON_RESULT" == "success" ]] || {
            echo "Python matrix did not pass: $PYTHON_RESULT" >&2
            exit 1
          }
          [[ "$DEPENDENCY_REVIEW_RESULT" == "success" || "$DEPENDENCY_REVIEW_RESULT" == "skipped" ]] || {
            echo "Dependency review did not pass: $DEPENDENCY_REVIEW_RESULT" >&2
            exit 1
          }
