[project]
name = "geyser-open-workspace"
version = "0.0.0"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["sdk/python", "cli"]

[tool.uv.sources]
geyser-sdk = { workspace = true }

[dependency-groups]
dev = [
  "build>=1.6.0,<2",
  "coverage[toml]>=7.16.0,<8",
  "mypy>=2.3.1,<3",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "respx>=0.23.1,<1",
  "ruff>=0.16.5,<1",
  "twine>=7.0.0,<8",
  "types-jsonschema>=4.26.0.20260518,<5",
]
release = [
  "pyinstaller==6.22.2",
]
docs = [
  "mike>=2.2.0,<3",
  "mkdocs-material>=9.7.7,<10",
]

[tool.pytest.ini_options]
testpaths = ["sdk/python/tests", "cli/tests", "conformance/tests", "tests"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["schemas", "openapi"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["geyser_sdk", "geyser_cli"]
mypy_path = ["sdk/python/src", "cli/src"]

[tool.coverage.run]
branch = true
source = ["geyser_sdk", "geyser_cli"]

[tool.coverage.report]
fail_under = 85
show_missing = true
