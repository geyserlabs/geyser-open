[project]
name = "geyser-open-workspace"
version = "0.0.0"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["sdk/python", "cli"]

[tool.uv.sources]
geyser-sdk = { workspace = true }

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "coverage[toml]>=7.10,<8",
  "mypy>=1.17,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
  "twine>=6.1,<7",
  "types-jsonschema>=4.25,<5",
]

[tool.pytest.ini_options]
testpaths = ["sdk/python/tests", "cli/tests", "conformance/tests", "tests"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["schemas", "openapi"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["geyser_sdk", "geyser_cli"]
mypy_path = ["sdk/python/src", "cli/src"]

[tool.coverage.run]
branch = true
source = ["geyser_sdk", "geyser_cli"]

[tool.coverage.report]
fail_under = 85
show_missing = true
