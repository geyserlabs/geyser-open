site_name: Geyser Developers
site_description: Public SDK, CLI, emulator, contracts, and guides for durable framework-neutral agentic systems.
site_url: https://docs.geyserlabs.ai/
repo_url: https://github.com/geyserlabs/geyser-open
repo_name: geyserlabs/geyser-open
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Geyser Labs

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: custom
      accent: custom

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra:
  version:
    provider: mike
    alias: true
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/geyserlabs/geyser-open
      name: Geyser Open on GitHub
  generator: false

nav:
  - Overview: index.md
  - Start:
      - Five-minute emulator quickstart: quickstart.md
      - Authentication and projects: authentication.md
      - Recipes and examples: recipes.md
      - Troubleshooting: troubleshooting.md
  - SDK and CLI:
      - Python SDK: sdk.md
      - CLI reference: cli.md
      - Structured outcomes: outcomes.md
  - Durable execution:
      - Runs, events, and checkpoints: durable-runs.md
  - Build and extend:
      - Skills, tools, connectors, and evaluators: extensions.md
      - Specialists and model profiles: specialists.md
      - Agent Bundles and safe imports: bundles.md
  - Platform:
      - Runtime capability matrix: compatibility.md
      - Customer Cells and privacy: cells-privacy.md
      - OpenAPI and schemas: reference.md
  - Trust and releases:
      - Release verification: releases.md
      - Independent developer preview gate: external-preview.md
      - Security: security.md
      - Changelog: changelog.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
