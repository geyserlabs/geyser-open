[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "geyser-sdk"
version = "0.1.0b3"
description = "Typed Python SDK and deterministic emulator for the public Geyser developer API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Geyser Labs", email = "security@geyserlabs.ai" }]
keywords = ["agents", "durable", "sdk", "emulator", "geyser"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "respx>=0.22,<1",
]

[project.urls]
Homepage = "https://geyserlabs.ai/developers"
Documentation = "https://docs.geyserlabs.ai"
Repository = "https://github.com/geyserlabs/geyser-open"
Issues = "https://github.com/geyserlabs/geyser-open/issues"
Security = "https://github.com/geyserlabs/geyser-open/security/policy"

[tool.hatch.build.targets.wheel]
packages = ["src/geyser_sdk"]

[tool.hatch.build.targets.sdist]
include = ["src/geyser_sdk", "tests", "README.md", "pyproject.toml"]
