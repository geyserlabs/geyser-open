[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "geyser-open"
version = "0.1.0b1"
description = "Public developer CLI for durable Geyser agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Geyser Labs", email = "security@geyserlabs.ai" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "geyser-sdk==0.1.0b1",
  "keyring>=25.6,<26",
  "platformdirs>=4.3,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
geyser = "geyser_cli.__main__:main"

[project.urls]
Homepage = "https://geyserlabs.ai/developers"
Documentation = "https://docs.geyserlabs.ai"
Repository = "https://github.com/geyserlabs/geyser-open"
Security = "https://github.com/geyserlabs/geyser-open/security/policy"

[tool.hatch.build.targets.wheel]
packages = ["src/geyser_cli"]

[tool.hatch.build.targets.sdist]
include = ["src/geyser_cli", "tests", "README.md", "pyproject.toml"]
